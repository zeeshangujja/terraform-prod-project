name: deploy

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment to deploy"
        type: choice
        options: [dev, staging, prod]
        default: dev

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.env }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ inputs.env }}
    env:
      TARGET_ENV: ${{ inputs.env }}
      AWS_REGION: eu-north-1
    steps:
      - uses: actions/checkout@v4

      - name: Log in to AWS (OIDC, no keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Package the project and upload it with the tfvars
        env:
          BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          TFVARS: ${{ secrets.TFVARS }}
        run: |
          set -euo pipefail
          test -n "$TFVARS" || { echo "Secret TFVARS is missing in the ${TARGET_ENV} environment"; exit 1; }
          echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          git archive --format=zip -o release.zip HEAD
          printf '%s\n' "$TFVARS" > "${TARGET_ENV}.tfvars"
          aws s3 cp release.zip "s3://${BUCKET}/releases/${GITHUB_SHA}.zip"
          aws s3 cp "${TARGET_ENV}.tfvars" "s3://${BUCKET}/releases/${GITHUB_SHA}-${TARGET_ENV}.tfvars"
          rm -f "${TARGET_ENV}.tfvars"

      - name: Deploy on the EC2 through SSM
        env:
          BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          KEY="releases/${GITHUB_SHA}.zip"
          TFVARS_KEY="releases/${GITHUB_SHA}-${TARGET_ENV}.tfvars"

          cat > remote.sh <<EOF
          #!/bin/bash
          set -euo pipefail
          export HOME=/root
          export DEBIAN_FRONTEND=noninteractive
          export PATH=/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
          apt-get update -y
          apt-get install -y unzip curl ansible
          if ! command -v aws >/dev/null 2>&1; then
            curl -sSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscliv2.zip
            unzip -q -o /tmp/awscliv2.zip -d /tmp
            /tmp/aws/install
          fi
          rm -rf /opt/deploy
          mkdir -p /opt/deploy
          aws s3 cp s3://${BUCKET}/${KEY} /tmp/release.zip --region ${AWS_REGION}
          unzip -q -o /tmp/release.zip -d /opt/deploy
          aws s3 cp s3://${BUCKET}/${TFVARS_KEY} /opt/deploy/${TARGET_ENV}.tfvars --region ${AWS_REGION}
          trap 'rm -f /opt/deploy/${TARGET_ENV}.tfvars /tmp/release.zip; aws s3 rm s3://${BUCKET}/${TFVARS_KEY} --region ${AWS_REGION} || true' EXIT
          cd /opt/deploy/ansible
          ansible-playbook deploy.yml -e env=${TARGET_ENV} -e image_tag=${TAG} -e region=${AWS_REGION}
          EOF

          jq -Rs '{commands: split("\n"), executionTimeout: ["3600"]}' remote.sh > params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${TARGET_ENV} ${TAG}" \
            --parameters file://params.json \
            --cloud-watch-output-config CloudWatchOutputEnabled=true,CloudWatchLogGroupName=/ssm/terraform-deploy \
            --query "Command.CommandId" --output text)
          echo "SSM command: $CMD_ID"

          STATUS="Pending"
          for i in $(seq 1 240); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "[$i] status: $STATUS"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 15
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text | tail -n 60
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text | tail -n 30
          test "$STATUS" = "Success"
